# Cargo.toml: [workspace] [package] [dependencies] [profile.release]
[workspace]
# 注意：yumi-ebpf 是 bpfel-unknown-none 的 no_std 探针，无法用带 std 的目标（如
# aarch64-linux-android 或 Windows host）编译/检查，故从根 workspace 摘除，
# 作为独立 workspace 由 build.rs 用 `-Z build-std` 单独构建。勿把它加回 members。
members = ["xtask"]

[package]
name = "chiri"
version = "2.0.2"
edition = "2024"
authors = ["yuki <loyeturz@163.com>"]
license = "GPL-3.0-or-later"
description = "A powerful Android system daemon for monitoring and scheduling."
repository = "https://github.com/imacte/YukiCtrl"
keywords = ["android", "scheduler", "monitor"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
# --- 通用/核心 ---
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
libc = "0.2" 
# features = ["std"] 为 set_boxed_logger 所需（自写 log::Log 实现用它注册）
log = { version = "0.4", features = ["std"] }
# 构建期整目录嵌入（module/config）：新增/删除 yaml 无需改 .rs，见 common.rs [embedded]
include_dir = "0.7"

# --- 异步与 eBPF (新增) ---
# Aya 用于加载和与内核 eBPF 程序交互
aya = "0.14.0"
mio = { version = "1.0", features = ["os-ext"] }
# 只开用到的特性：Runtime::new/block_on/spawn（rt-multi-thread）、
# time::interval（time）、sync::watch（sync）。未用 macros（无 #[tokio::main]），
# 也未用 fs/net/io/process/signal，故不再开 full
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }

# --- Monitor 带来的依赖 ---    
inotify = "0.11.1"
regex = "1.12"
kobject-uevent = "0.2"
netlink-sys = "0.8"

# --- Scheduler 带来的依赖 ---
nix = { version = "0.31.2", features = ["fs", "signal", "inotify"] }
fluent = "0.17.0"
fluent-bundle = "0.16.0"
intl-memoizer = "0.5.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1