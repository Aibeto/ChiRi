# rules.yaml: [global-switches] [app-modes] [ignored-apps]
# 【只读】本文件编译期嵌入守护进程二进制（common::embedded_rules_str），运行时一律
# 读嵌入值：全局模式、应用性能模式等均由模块随附维护，WebUI 与磁盘文件改动均不影响
# 调度行为；本文件是启动时复制出的对外展示副本（common::sync_rules_snapshot）。

# [global-switches]
yumi_scheduler: true
dynamic_enabled: true
global_mode: "balance"

app_modes:

# [ignored-apps]
ignored_apps:
  - com.android.systemui
