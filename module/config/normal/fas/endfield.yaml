# ── FAS 配置：com.hypergryph.endfield（明日方舟：终末地）─────
# 编译期嵌入（src/common.rs::embedded_fas_app_str），不可编辑，不对外暴露。
# 未列出的字段取 src/fas_types.rs::FasRulesConfig 默认值。
fas_rules:
  fps_gears: [30.0, 60.0, 90.0, 120.0, 144.0, 165.0]
  fps_margin: 3.0
  per_app_profiles:
    com.hypergryph.endfield:
      target_fps: [60]
      fps_margin: 3.0
  # FAS 引擎侧温度护栏：看电池温度不看处理器（处理器长期 95℃ 属正常工作区，
  # 不作为降频依据）。电池温度 ≥45℃ 时 perf 压到 0.70（回落 42℃ 解除）；
  # 8475 实测内核 thermal 只盯 SoC 温度不管电池，电池安全边界由本护栏兜底。0 = 禁用
  core_temp_threshold: 45.0
