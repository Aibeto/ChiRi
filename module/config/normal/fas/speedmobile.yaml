# speedmobile.yaml: [fas-rules]
# FAS 配置：com.tencent.tmgp.speedmobile（QQ 飞车手游）
# 竞速特征：帧率稳定优先（掉帧直接感知）、氮气/漂移瞬时负载尖峰、触控高频。
# 省电思路与 sgame 一致：锁目标档位（60/120，杜绝高刷满频撑频率），氮气尖峰由
# PID 升频响应；perf_ceil 不覆盖（保持默认 1.0，最高性能释放不受限制）。
# 电池温度护栏与 sgame 一致：≥45℃ 压 perf 至 0.70（回落 42℃ 解除），兜底内核
# thermal 只盯 SoC 不管电池的缺口。
# 首刷验证（2026-09-22 加白，尚无实测帧率基准）：devimp fps 列应出值且贴合
# target 档；玩家若开 90 帧档，需把 target_fps 调整为 [60, 90, 120]。
fas_rules:
  fps_gears: [30.0, 60.0, 120.0]
  fps_margin: 3.0
  per_app_profiles:
    com.tencent.tmgp.speedmobile:
      target_fps: [60, 120]
      fps_margin: 3.0
  # 接管/切回后的起始性能 0.50（默认 0.45）：竞速进入对局节奏快，略抬高
  perf_init: 0.50
  core_temp_threshold: 45.0
