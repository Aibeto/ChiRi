# lolm.yaml: [fas-rules]
# FAS 配置：com.tencent.lolm（英雄联盟手游）
# MOBA 特征与 sgame（王者荣耀）一致：帧率稳定优先、触控交互高频、团战瞬时负载
# 尖峰——配置直接沿用 sgame 模板（2026-09-22 8475 实测：default 裸跑时 prime
# 顶格 0.67 util、迁移 1.2 万/s）。
# 省电思路：锁目标档位（60/120，杜绝高刷满频撑频率）+ 团战尖峰由 PID 升频响应；
# perf_ceil 不覆盖（保持默认 1.0，最高性能释放不受限制）。
# 电池温度护栏与 sgame 一致：≥45℃ 压 perf 至 0.70（回落 42℃ 解除），兜底内核
# thermal 只盯 SoC 不管电池的缺口。
# 首刷验证（2026-09-22 加白，尚无实测帧率基准）：devimp fps 列应出值且贴合
# target 档；玩家若开 90 帧档，需把 target_fps 调整为 [60, 90, 120]。
fas_rules:
  fps_gears: [30.0, 60.0, 120.0]
  fps_margin: 3.0
  per_app_profiles:
    com.tencent.lolm:
      target_fps: [60, 120]
      fps_margin: 3.0
  # 接管/切回后的起始性能 0.50（默认 0.45）：MOBA 进入对局节奏快，略抬高
  perf_init: 0.50
  core_temp_threshold: 45.0
