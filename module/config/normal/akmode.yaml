# ── 明日方舟特调（akmode）配置 ─────────────────────────────
# 编译期嵌入二进制（src/common.rs include_str!），磁盘副本不加载。
# 字段说明见 akmode-example.yaml；未写字段取代码默认值。
#
# 无档位连续控制：每个负载 tick（40ms）按核心组实时负载直接计算
# scaling_max_freq 目标上限，升频立即执行、降频 hysteresis + down_hold_ms
# 防抖。替代原四档方案（少数线程高占用负载下 max 单边下探）。
akmode:
  headroom: 1.15
  perf_floor: 0.0
  hysteresis: 0.03
  down_hold_ms: 100
