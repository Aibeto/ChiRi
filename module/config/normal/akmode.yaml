# 明日方舟特调（akmode）配置 —— MSM8998（骁龙 835），随本处理器目录发布
# 档位由 rules.yaml 生效模式决定，特调期间固定不切换，
# 档位差异仅在升降频策略参数（所有档位都能使用硬件最高档位）。
# 机制：激活时写 schedutil、min 压到硬件最低、max 为硬件最高；用本档策略参数按负载
# 升降 max（内核频率表逐档移动，可升到硬件最高、降到硬件最低）：
#   升频 = 任一组内达到 up_core_count 个核心占用率 > up_util_percent
#   降频 = 任一组内达到 down_core_count 个核心占用率 < down_util_percent
# 核心数为组内绝对个数：写 2 = 组内 2 个核心命中即触发；0 = 组内任一核心命中即触发；
# 写大值如 64 = 关闭该方向判定。
# 升频前会检查实际频率是否已达当前设定的 max（schedutil 余量），达到才升一档。
# wait_ms 为升降频防抖；after_change_duration_ms 内升降频后 wait_ms 减半。
# 核心组区间由代码按命中 SoC 区分（common::chiri_core_ranges）：little 0-3 / big 4-7，
# 无超大核——prime 组区间为空，本文件里的 prime 段不生效。
# 参数与 8550 基线一致（8450/8998 共用同一套参数），改参数时如无 SoC 差异请同步另两份。
akmode:
  after_change_duration_ms: 799

  powersave:
    wait_ms: 325
    little:
      up_core_count: 2
      up_util_percent: 90
      down_core_count: 2
      down_util_percent: 60
    big:
      up_core_count: 3
      up_util_percent: 90
      down_core_count: 2
      down_util_percent: 60
    prime:
      up_core_count: 1
      up_util_percent: 90
      down_core_count: 1
      down_util_percent: 60

  balance:
    wait_ms: 80
    little:
      up_core_count: 2
      up_util_percent: 80
      down_core_count: 2
      down_util_percent: 60
    big:
      up_core_count: 3
      up_util_percent: 60
      down_core_count: 2
      down_util_percent: 60
    prime:
      up_core_count: 1
      up_util_percent: 80
      down_core_count: 1
      down_util_percent: 60

  performance:
    wait_ms: 60
    little:
      up_core_count: 2
      up_util_percent: 60
      down_core_count: 2
      down_util_percent: 60
    big:
      up_core_count: 3
      up_util_percent: 60
      down_core_count: 2
      down_util_percent: 60
    prime:
      up_core_count: 1
      up_util_percent: 60
      down_core_count: 1
      down_util_percent: 60

  fast:
    wait_ms: 40
    little:
      up_core_count: 1
      up_util_percent: 60
      down_core_count: 3
      down_util_percent: 30
    big:
      up_core_count: 3
      up_util_percent: 60
      down_core_count: 2
      down_util_percent: 30
    prime:
      up_core_count: 1
      up_util_percent: 60
      down_core_count: 1
      down_util_percent: 30
