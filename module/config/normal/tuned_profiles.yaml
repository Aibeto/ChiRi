# tuned_profiles.yaml: [default-profile] [tuned-profiles]
# 特调参数组：缺省参数段（akmode）+ 按模式名分派的参数组（tuned_profiles）
# 编译期嵌入二进制（module/config 目录整体 include_dir!），磁盘副本不加载。
# 字段说明见 tuned_profiles-example.yaml；未写字段取代码默认值。
#
# 无档位连续控制：每个负载 tick（40ms）按核心组实时负载直接计算
# scaling_max_freq 目标上限，升频立即执行、降频 hysteresis + down_hold_ms
# 防抖。替代原四档方案（少数线程高占用负载下 max 单边下探）。
# [default-profile]
# 缺省参数（akmode 游戏特调；未在 tuned_profiles 中注册的模式都回退到这段）
akmode:
  headroom: 1.15
  perf_floor: 0.0
  hysteresis: 0.03
  down_hold_ms: 100

# [tuned-profiles]
# 按特调模式名分派的参数组（模式名在 special_tuned.yaml 的模式列表中注册，
# 与这里的键同名即自动生效；未注册的模式回退上面的 akmode 段）。
# 机制与 akmode 完全共用，差异只在参数倾向：
tuned_profiles:
  # playback —— 视频播放稳态（2026-09-17 8550 实测新增）：只有长稳态场景
  # 值得特调（上机反馈：高频短交互不该被接管，daily 组已于当晚移除）。
  # boost_affinity=false：不做 boost 亲和收窄、不保大核常在线——保大核与
  # 「贴负载省电」相反，播放场景让核按 EAS 自然摆放。
  #
  # 2026-09-20 8550 视频功耗回放调整（依据见 .codebuddy/docs/2026-09-20-8550-video-power-analysis.md）：
  # - headroom 1.05 → 0.95：原「别压太紧」档位下 little 上限仍达 72%（p95 100%），
  #   而 capfreq_little 与 batt_p 相关性最强（r=0.884），是头号功耗驱动；
  # - util_smoothing 0.35 → 0.25：进一步滤掉弹幕/进度条尖峰，压 prime 的 p95（84%）；
  # - per_cluster：三簇形态不同，模式级一刀切必然顾此失彼——
  #     little 过载（各核 util 54~59%、p95 近 100%）→ 再收一档并压天花板 0.65；
  #     prime 空转（util p50=0）却被尖峰顶到 84% → 收 headroom + 天花板 0.50；
  #     big（util 30~39%）不覆盖，跟随模式级 0.95；
  # - migration_cost_ns 400000：稳态下调高迁移成本，减少无谓跨核搬迁（实测 ≈557 次/s），
  #   接管期生效、退出按快照恢复（feature.yaml 的一次性 200000 不受影响）。
  # **未列 per_cluster 的 big、以及所有组的未列字段都回退上面的模式级值。**
  playback:
    headroom: 0.95
    perf_floor: 0.0
    perf_ceil: 1.0
    hysteresis: 0.04
    down_hold_ms: 100
    util_smoothing: 0.25
    boost_affinity: false
    per_cluster:
      little:
        headroom: 0.90
        perf_ceil: 0.65
      prime:
        headroom: 0.80
        perf_ceil: 0.50
    migration_cost_ns: 400000
