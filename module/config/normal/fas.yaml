# fas.yaml: [fas-whitelist]
# FAS（帧感知调度）白名单
# 编译期嵌入二进制（module/config 目录整体 include_dir!），用户/WebUI 不可修改。
# 运行时由 main.rs 导出到模块根 fas_whitelist.yaml，供 WebUI 只读展示。
# 每项：<精确包名>: <fas 配置名>（对应 module/config/normal/fas/<配置名>.yaml）
# 新增 FAS 游戏：本表加一行 + 新建 module/config/normal/fas/<配置名>.yaml
#               （目录构建期自动收录，无需改 .rs）
fas:
  apps:
    com.hypergryph.endfield: endfield
    com.levelinfinite.sgameGlobal: sgame
    # 王者荣耀**国服**（2026-09-22 8475 实测：国服玩家实际玩的是 tmgp.sgame，
    # 白名单此前只有国际版 sgameGlobal → 国服一直在 default 裸跑 4.65W）
    com.tencent.tmgp.sgame: sgame
    # 2026-09-22 8475 实测新增：两款游戏此前在 default 模式裸跑（prime 顶格
    # 0.61-0.67 util、迁移 1.2-2.1 万/s、4.13/3.09W），按 sgame 模板接入 FAS。
    # 首刷后看 devimp fps 列是否贴合 target 档（玩家若开 90 帧需调 target_fps）。
    com.tencent.tmgp.speedmobile: speedmobile
    com.tencent.lolm: lolm
