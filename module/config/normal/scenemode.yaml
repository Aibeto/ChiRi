# 息屏场景模式（scenemode）：息屏超过 scene_mode_delay_secs 后切换，压低功耗拉长续航。
# 需要关闭时把 enabled 改为 false
scenemode:
  cpu_load_governor:
    enabled: true
    up_threshold: 1.0
    down_threshold: 0.01
    smoothing_up: 0.01
    down_rate_limit_ticks: 1
    up_rate_limit_ticks: 10
    headroom_factor: 1.0
    headroom_ramp: 0.15
    perf_floor: 0.0
    perf_ceil: 0.15
    perf_init: 0.15
    up_jump_threshold: 0.50
    slow_up_scale: 0.02
    down_fast_threshold: 0.30
    spike_jump_threshold: 0.30
    spike_decay: 0.10
    touch_boost_enabled: false
    touch_boost_ms: 0
    touch_boost_tiers: 1
    