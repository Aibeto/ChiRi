# akmode-example.yaml: [usage] [akmode]
# akmode-example.yaml —— 明日方舟特调参考配置
#
# 本文件不参与加载，纯粹当字段说明书用。复制成 akmode.yaml 再改。
# 注意：akmode.yaml 随 module/config 目录整体编译期嵌入，磁盘副本不加载，
# 改参数要改源文件再重新编译。
#
# 生效条件：前台是明日方舟（包名命中 special_tuned.yaml）。
# 生效期间 CLG 让位，akmode 接管；退出前台交还 CLG。
#
# 调频机制（无档位，FAS 式负载直拉）：
# 写 schedutil、min 压到硬件最低；每个负载 tick（40ms）按核心组实时
# 负载直接计算 scaling_max_freq 目标上限：
#   目标比例 = clamp(组内最大核心占用率 × headroom, perf_floor, 1.0)
#   目标上限 = 频率表中不低于 目标比例 × 硬件最高 的最低档位
# 升频立即执行（响应性优先）；降频须目标偏离超过 hysteresis 且持续
# down_hold_ms 才执行（防负载抖动来回改写）。
#
# 为什么没有档位：原四档（powersave/balance/performance/fast）按
# 「组内 N 个核心过阈值」升降，在少数线程高占用的负载（如明日方舟
# 资源校验：一两个线程吃满单核、组内其余空闲）下升频条件永远凑不齐、
# 降频条件持续满足，max 单边下探到最低频。连续控制对任意负载形态
# 都能跟随实际需求，不再依赖负载在组内的分布。
#
# 核心组区间由 common::chiri_core_ranges() 按 SoC 区分：
#   8550: little 0-2 / big 3-6 / prime 7
#   8475: little 0-3 / big 4-6 / prime 7
#   8998: little 0-3 / big 4-7 / 无 prime
akmode:
  # 负载放大系数（1.0~2.0）：目标比例 = 组内最大核心占用率 × 该值。
  # 1.0 = 上限贴着当前负载走（最省电，但突发负载要靠 schedutil 自身余量）；
  # 1.15 = 留 15% 升频余量，突发负载升频更从容。默认 1.15。
  headroom: 1.15

  # 目标比例下限（0~0.5）：空闲组上限可以收到的最低比例。
  # 0 = 空闲组上限一路收到硬件最低频（最省电）；
  # 0.2 = 最低也保 20% 频率上限，减少轻负载反复取档。
  perf_floor: 0.0

  # 变更死区（0~0.2，比例）：目标与当前上限差值不超过「该比例 × 硬件最高」
  # 时不写 sysfs，防写抖动。默认 0.03（对 3.2GHz prime 即 ~96MHz 死区）。
  hysteresis: 0.03

  # 降频保持（ms，0~5000）：目标持续低于当前上限该时长才真正下调。
  # 0 = 跟随每 tick 目标立即下调（不推荐，负载抖动会频繁改写）。
  down_hold_ms: 100
