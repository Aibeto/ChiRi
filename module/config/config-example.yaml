# config-example.yaml: [meta] [function] [io-settings] [cpu-idle] [scene-delay] [affinity] [corectl] [thermal] [modes]
# 完整字段说明书：原 config.yaml 已拆分为 meta.yaml（可修改抬头，daemon 严格校验）
# 与 feature.yaml（不可修改调优段，仅存于二进制不落盘）。本文件不参与加载，
# 纯粹当字段说明书用；改 meta/feature 模板源文件后重新编译才生效。
#
# 注意：调优配置编译期嵌入二进制（module/config 目录整体 include_dir!），磁盘文件只是
# "嵌入内容 + meta 覆盖"的快照。daemon 启动/重载时会把嵌入内容
# 写回磁盘，篡改会被还原。允许外部修改的字段只有四个：
# meta.loglevel / meta.dev_record / meta.fas_enabled / meta.scenemode_enabled
# （WebUI 日志等级/开发记录/FAS/场景模式开关落点）。
# 改调优参数要改这份模板源文件再重新编译。

# [meta]
# 允许外部修改的字段：loglevel + dev_record + fas_enabled + scenemode_enabled
# （WebUI 开关，热重载生效）
# language 等其余 meta 字段固定，外部修改无效且被快照自愈还原
meta:
  name: "example_config" # 仅供文档参考，代码不解析
  author: "ChiRi" # 仅供文档参考
  language: "zh" # en / zh；以嵌入值为准，外部修改无效（会被快照自愈还原）
  loglevel: "INFO" # DEBUG / INFO / WARN / ERROR
  # 开发记录开关：true 时守护进程向 devimp/devimp_<前台包名>_<毫秒时间戳>.log
  # 写入按核调度诊断日志（tick/snap/place/aff/core/event），前台包名切换自动
  # 换新文件（单文件软上限 128MB，触顶换新文件继续写），用于离线分析改善调度。
  # 布尔值必须裸写（serde_yaml 把带引号的
  # "true" 解析为字符串而非 bool）。允许外部修改（WebUI 开关 + 热重载）
  dev_record: false
  # ── 功能总开关（缺省 true，允许外部修改：手改后热重载即时生效；布尔值必须裸写）──
  # fas_enabled：FAS 帧感知调度总闸。false 后 fas_available() 恒为 false——
  #   determine_mode 不再产生 fas 模式、FAS 监测线程不启动、运行中 FAS 实例立即
  #   注销并按屏幕状态恢复 balance/doze 接管。
  fas_enabled: true
  # scenemode_enabled：息屏场景模式总闸。false 后息屏不再进入 scenemode；
  # 已激活的下个负载 tick 自动退出并恢复 affinity/core_ctl 快照 + doze 配置。
  scenemode_enabled: true

# [function]
function:
  # cpuidle governor 切换：true 时把 CpuIdle.current_governor 写入 sysfs
  CpuIdleScalingGovernor: false
  # IO 优化：true 时写入 I/O 调度器、预读、合并策略
  IOOptimization: true

# [io-settings]
IO_Settings:
  # I/O 调度器（写入 /sys/block/*/queue/scheduler）
  # "none"（NVMe/UFS 默认）、"mq-deadline"、"cfq"，空串不切换
  Scheduler: "none"
  # 预读大小 kB（写入 /sys/block/*/queue/read_ahead_kb）
  read_ahead_kb: "128"
  # 请求合并：0=不禁用（系统默认）、1=禁止简单合并、2=完全禁止
  nomerges: "2"
  # IO 统计：0=关（省开销）、1=开（调试时用）
  iostats: "0"

# [cpu-idle]
CpuIdle:
  # 写入 /sys/devices/system/cpu/cpuidle/current_governor
  # "menu"（交互设备默认，按预期空闲时长选最深 C 状态）、"ladder"、"teo"
  # 空串不切换，且 CpuIdleScalingGovernor 须为 true 才生效
  current_governor: ""

# [scene-delay]
# 息屏省电（已暂停）
# [已暂停] 息屏节电（doze + scenemode）触发点在调度器内注释（src/chiri/mod.rs
# 搜 "PAUSED"），屏幕状态不再驱动调度；字段保留供日后恢复。
# 恢复后语义：屏幕熄灭超过该秒数后切到 scenemode 低功耗配置，亮屏恢复原模式。
# 默认 300（5 分钟）。
scene_mode_delay_secs: 300

# [affinity]
# CPU 亲和与线程迁移（ChiRi 专属）
# boost 模式（performance/fast/特调/fas）下收窄 top-app/foreground cpuset
# 到大核+超大核、后台分组压小核；线程层按核心粒度做 sched_setaffinity
# 单核放置（前台关键线程→prime、普通→big；后台繁忙线程动态 promote，
# 空闲 demote；选核排除离线核）。
# [已暂停] 息屏不再切换 normal/doze 布局（屏幕状态不驱动调度），亲和按亮屏
# 口径常态生效；布局切换代码保留（affinity::apply 的 screen_on 参数）。
# 黑名单在 src/chiri/affinity_blacklist.yaml（编译嵌入，不外透）。
Affinity:
  # 总开关：false 时全量恢复系统布局，不做任何写入
  enabled: true
  # boost 下 top-app 的 cpu.uclamp.min 百分比（0=不启用；uclamp.min 会让
  # schedutil 独立于 CLG 抬频，与动态上限语义打架，默认关闭）
  top_app_uclamp_min_pct: 0
  # boost 下 top-app 的 cpu.uclamp.max 百分比（任务级性能上限，EAS 原生感知；
  # 内核 >= 5.3 生效，节点缺失/写入回读无效会自动纠正关闭）。
  # 按机型：8550/8475 配 85，8998（内核 4.4）配 0 关闭
  top_app_uclamp_max_pct: 85
  # 线程层总开关：前台线程按核钉定 + 后台动态 promote/demote（仅亮屏）
  pin_foreground_threads: true

# [corectl]
# core_ctl 核心在线接管（ChiRi 专属）
# boost 模式把各 cluster 的 min_cpus 抬到全组常在线，防厂商热插拔
# 与 ChiRi 调频打架；退出 boost 恢复快照。只动 min_cpus。
CoreCtl:
  # 总开关：false 时不写任何 core_ctl 节点
  enabled: true
  # scenemode 离线核（息屏深度省电）：进入 scenemode（息屏超过
  # scene_mode_delay_secs）后仅 prime（超大核）整簇断电消除空转漏电流，
  # 小核 + 大核全开常驻（频率上限由 scenemode CLG 配置压到 0.15 档），
  # 编号最大的小核独占给调度服务（从业务 cpuset 组移除 + 自身线程移入
  # 根组 + 自钉，后台任务堵塞不了调度服务）。常驻簇（小核+大核）util
  # 持续 10s 顶满 70% 视为饱和 → 自动退回 powersave 并进入 300s 冷却
  # （期间不得重进 scenemode）；重进前还须负载回落到阈值下方。亮屏/退出
  # 按快照恢复，维持期每 2s 纠偏（厂商偷拉起的核重新下线、框架加回
  # 保留核重新移除）。逐核回读验证，内核拒绝的核自动跳过。与 boost 互斥。
  # 8550/8475 建议 true；8998（内核 4.4 热插拔质量未知）建议 false。
  scenemode_offline: true

# [thermal]
# 热保护
# 电池温度是主参考（壳体发热由电池主导，温升慢但持续）；
# CPU 温度只在极端热时参与（内核 95°C 温控才是主力）。
# 豁免档 free_above：当前性能比已高于该值时不压制——高负载不挡路。
# 仅对 CLG 模式生效（fast/akmode 不受影响）。
# 温度输入经滤波（物理范围门 + 毛刺丢弃 + 3 样本中值 + 斜率限制）：
# soc_max 等合成温区读数跳变极大（实测 2s 内 ±25°C），不滤波会让 cap
# 以 ~8s 周期反复跳变（bang-bang 振荡，高负载游戏周期性卡顿）。
# 解除方向限速：压制加深立即生效，解除每 2s 最多 +0.15 逐级恢复。
Thermal:
  enabled: true
  # 电池软限（°C）：手机壳体开始发烫的临界点
  batt_soft_temp_c: 41
  # 电池硬限（°C）：手握明显发烫
  batt_hard_temp_c: 45
  # CPU 软限（°C）：接近内核温控起控点才参与。soc_max 在大型游戏高负载下
  # 常态 85°C+，阈值过低（如 75）会导致过半时间被软件压制、比官调更卡
  cpu_soft_temp_c: 90
  # CPU 硬限（°C）：极端情况才触发
  cpu_hard_temp_c: 95
  # 软限触发后压到的性能比例
  soft_perf_cap: 0.70
  # 硬限触发后压到的性能比例（必须 <= soft_perf_cap）
  hard_perf_cap: 0.40
  # 豁免档：当前性能比已超过此值时不压制。默认 0.80
  free_above: 0.80
  # 回滞（°C）：温度降到 软限 - hysteresis 以下才解除压制
  hysteresis_c: 3

# [modes]
# 性能模式（CLG 调频参数）
#
# 四档模式：powersave / balance / performance / fast。
# 每档独立一组 cpu_load_governor 参数，结构完全相同。
#
# CLG 调频语义（动态上限）：
#   接管时 min 压到硬件最低，之后只写 max（性能上限）。
#   schedutil 在 [min, max] 内按瞬时负载自主调频——空闲时降到地板，
#   忙碌时贴近 max。不用等 160ms tick 才降频，内核微秒级就降下来，
#   空转发热比锁频方案小很多。
#
#   perf_floor / perf_ceil / perf_init 约束的是"上限"，
#   实际空闲频率由 schedutil 自己决定。
#
# fast 模式不走 CLG：min=max=硬件最高频硬锁，见 src/chiri/fast.rs。

# 替换成 powersave / balance / performance
powersave:
  cpu_load_governor:
    # 升频阈值：cluster 最大 util >= 此值时进入升频区间（0..1）
    # 调大更难触发升频，省电但响应慢
    up_threshold: 0.85

    # 降频阈值：util 跌破此值进入降频区间（0..1）
    # 调小更难降频，性能维持更好但更耗电
    down_threshold: 0.60

    # 升频平滑系数（0..1）：每 tick 目标性能只逼近该比例
    # 大 = 升频快、响应迅速，小 = 平滑、不跳变
    smoothing_up: 0.40

    # 降频速率限制（tick 数）：连续满足降频条件才执行一次
    # 调大降频更谨慎，防短暂波动导致频繁降频
    down_rate_limit_ticks: 2

    # 升频速率限制（tick 数）：连续满足升频条件才执行一次
    up_rate_limit_ticks: 2

    # 性能余量因子（>=1）：util 达 up_threshold 后目标性能放大此系数
    # 给突发负载预留频率余量，调大余量大、功耗高
    headroom_factor: 1.10

    # headroom 过渡带宽度（0..1）：up_threshold 附近线性渐变，
    # 避免到达阈值时性能突然阶跃
    headroom_ramp: 0.15

    # 性能下限（0..1）：目标性能永不低于此值
    # 保底频率，调高卡顿少但功耗大。必须 <= perf_ceil
    perf_floor: 0.10

    # 性能上限（0..1）：目标性能永不高于此值
    # 1.0 = 允许跑硬件最高频。必须 >= perf_floor
    perf_ceil: 0.70

    # 初始性能（0..1）：CLG 接管瞬间的起点
    # 避免从 0 爬升导致开机卡。必须在 [perf_floor, perf_ceil] 内
    perf_init: 0.30

    # 升频快速通道：target_perf 超过 current_perf 幅度大于此值时直接升
    # 应对冷启动等负载突增
    up_jump_threshold: 0.35

    # 滞回带升频缩放（0..1）：滞回带内靠近 down_threshold 端升频更慢
    # 调小低负载端更保守，更省电
    slow_up_scale: 0.02

    # 极低负载阈值（0..1）：util 低于此值时跳过降频防抖、立即降频
    # 息屏或空闲时迅速拉低频率
    down_fast_threshold: 0.10

    # 尖峰抑制阈值（0..1）：单 tick util 跳升超此值时衰减增量
    # 防止孤立尖峰瞬间拉满频率
    spike_jump_threshold: 0.35

    # 尖峰衰减比例（0..1）：增量保留比例
    # 0 = 完全抑制，1 = 不抑制
    spike_decay: 0.30

    # 触摸升频开关：触摸时抬高大核性能上限，窗口内锁定
    touch_boost_enabled: true
    # 触摸升频窗口（ms）：触摸后大核保持抬高状态的时长
    touch_boost_ms: 400
    # 触摸升频档数：在可用频率表中向上移动的档数
    touch_boost_tiers: 1
