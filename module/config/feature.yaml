# yumi 配置文件，不能动
# config.yaml: [meta] [function] [io-settings] [cpu-idle] [powersave] [balance] [performance] [fast]

# [function]
# 主要功能开关
function:
  CpuIdleScalingGovernor: false
  IOOptimization: true

# [io-settings]
# IO 设置
IO_Settings:
  Scheduler: "none"
  read_ahead_kb: "128"
  nomerges: "2"
  iostats: "0"

# [cpu-idle]
# CPU 空闲设置
CpuIdle:
  current_governor: ""

# [powersave]
# 省电模式
powersave:
  cpu_load_governor:
    up_threshold: 0.85
    down_threshold: 0.60
    smoothing_up: 0.40
    smoothing_down: 0.50
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.10
    headroom_ramp: 0.15
    perf_floor: 0.10
    perf_ceil: 0.70
    perf_init: 0.30
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [balance]
# 均衡模式
balance:
  cpu_load_governor:
    up_threshold: 0.80
    down_threshold: 0.50
    smoothing_up: 0.60
    smoothing_down: 0.30
    down_rate_limit_ticks: 3
    up_rate_limit_ticks: 2
    headroom_factor: 1.25
    headroom_ramp: 0.15
    perf_floor: 0.15
    perf_ceil: 1.0
    perf_init: 0.50
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [performance]
# 性能模式
performance:
  cpu_load_governor:
    up_threshold: 0.65
    down_threshold: 0.40
    smoothing_up: 0.80
    smoothing_down: 0.20
    down_rate_limit_ticks: 5
    up_rate_limit_ticks: 1
    headroom_factor: 1.40
    headroom_ramp: 0.15
    perf_floor: 0.35
    perf_ceil: 1.0
    perf_init: 0.60
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [fast]
# 极速模式
fast:
  cpu_load_governor:
    up_threshold: 0.01
    down_threshold: 0.01
    smoothing_up: 1.0
    smoothing_down: 0.01
    down_rate_limit_ticks: 10
    up_rate_limit_ticks: 1
    headroom_factor: 2.0
    headroom_ramp: 0.15
    perf_floor: 1.0
    perf_ceil: 1.0
    perf_init: 1.0
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    spike_decay: 0.30
