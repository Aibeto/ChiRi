# yumi 配置文件，不能动
# config.yaml: [meta] [function] [io-settings] [cpu-idle] [reduce] [default] [boost] [vector]

# [function]
# 主要功能开关
function:
  CpuIdleScalingGovernor: false
  IOOptimization: true

# [io-settings]
# IO 设置
IO_Settings:
  Scheduler: "none"
  read_ahead_kb: "128"
  nomerges: "2"
  iostats: "0"

# [cpu-idle]
# CPU 空闲设置
CpuIdle:
  current_governor: ""

# [reduce]
# 省电模式（CLG 家族）：较 default 升频更保守（up 0.85>0.80）、降频更激进
# （down 0.60>0.50、rate_limit 2），频率上限压到 0.70
reduce:
  cpu_load_governor:
    up_threshold: 0.85
    down_threshold: 0.60
    smoothing_up: 0.40
    smoothing_down: 0.50
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.10
    headroom_ramp: 0.15
    perf_floor: 0.10
    perf_ceil: 0.70
    perf_init: 0.30
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [default]
# 均衡模式（CLG 家族）：默认档兼参考基线
default:
  cpu_load_governor:
    up_threshold: 0.80
    down_threshold: 0.50
    smoothing_up: 0.60
    smoothing_down: 0.30
    down_rate_limit_ticks: 3
    up_rate_limit_ticks: 2
    headroom_factor: 1.25
    headroom_ramp: 0.15
    perf_floor: 0.15
    perf_ceil: 1.0
    perf_init: 0.50
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [boost]
# 性能模式（CLG 家族）：较 default 升频更激进（up 0.65<0.80）、降频略消极
# （down 0.40<0.50、rate_limit 5），headroom 1.40 给线程/核心更大余量
boost:
  cpu_load_governor:
    up_threshold: 0.65
    down_threshold: 0.40
    smoothing_up: 0.80
    smoothing_down: 0.20
    down_rate_limit_ticks: 5
    up_rate_limit_ticks: 1
    headroom_factor: 1.40
    headroom_ramp: 0.15
    perf_floor: 0.35
    perf_ceil: 1.0
    perf_init: 0.60
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [vector]
# 极速模式（rhine 家族，仅实验室）：全核最高频——运行时走 fast_lock 硬锁
# （min=max=hw_max、governor 保持 schedutil），不读本段参数；本段仅为缺省值来源
vector:
  cpu_load_governor:
    up_threshold: 0.01
    down_threshold: 0.01
    smoothing_up: 1.0
    smoothing_down: 0.01
    down_rate_limit_ticks: 10
    up_rate_limit_ticks: 1
    headroom_factor: 2.0
    headroom_ramp: 0.15
    perf_floor: 1.0
    perf_ceil: 1.0
    perf_init: 1.0
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.10
    down_fast_mult: 2.5
    spike_jump_threshold: 0.35
    spike_decay: 0.30
