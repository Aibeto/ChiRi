meta:
  name: "config_8475"
  author: "ChiRi"
  language: "zh"
  loglevel: "INFO"
  dev_record: true

function:
  CpuIdleScalingGovernor: true
  IOOptimization: true

IO_Settings:
  Scheduler: ""
  read_ahead_kb: "512"
  nomerges: "1"
  iostats: "0"

CpuIdle:
  current_governor: "menu"

scene_mode_delay_secs: 300

Affinity:
  enabled: true
  top_app_uclamp_min_pct: 0
  top_app_uclamp_max_pct: 85
  pin_foreground_threads: true

CoreCtl:
  enabled: true
  # scenemode 离线核：息屏超时进入 scenemode 后小核全开（保证 ≥3 个待命核响应
  # 电源键等事件，另留 1 个专用小核给调度服务），大核簇/prime 整簇断电消除
  # 空转漏电流；little 持续顶满上限则退回 powersave 并冷却 300s。亮屏按快照恢复。
  scenemode_offline: true

Thermal:
  enabled: true
  batt_soft_temp_c: 41
  batt_hard_temp_c: 45
  # CPU 温度仅极端热时参与（内核 ~95°C 温控兜底）：8475 soc_max 合成温区在
  # 大型游戏高负载下常态 85°C+，75/85 会导致过半时间被软件压制（实测 84%）、
  # 比官调更卡；90/95 只在接近内核起控点时提前轻压
  cpu_soft_temp_c: 90
  cpu_hard_temp_c: 95
  soft_perf_cap: 0.70
  hard_perf_cap: 0.40
  free_above: 0.80
  hysteresis_c: 3

powersave:
  cpu_load_governor:
    up_threshold: 0.90
    down_threshold: 0.50
    smoothing_up: 0.50
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    headroom_ramp: 0.12
    perf_floor: 0.05
    perf_ceil: 0.60
    perf_init: 0.25
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    down_fast_threshold: 0.10
    spike_jump_threshold: 0.35
    spike_decay: 0.30
    touch_boost_enabled: true
    touch_boost_ms: 350
    touch_boost_tiers: 1

balance:
  cpu_load_governor:
    up_threshold: 0.72
    down_threshold: 0.55
    smoothing_up: 0.75
    down_rate_limit_ticks: 1
    up_rate_limit_ticks: 1
    headroom_factor: 1.20
    headroom_ramp: 0.12
    perf_floor: 0.10
    perf_ceil: 1.0
    perf_init: 0.40
    up_jump_threshold: 0.30
    slow_up_scale: 0.03
    down_fast_threshold: 0.20
    spike_jump_threshold: 0.40
    spike_decay: 0.25
    touch_boost_enabled: true
    touch_boost_ms: 400
    touch_boost_tiers: 1

performance:
  cpu_load_governor:
    up_threshold: 0.55
    down_threshold: 0.40
    smoothing_up: 0.95
    down_rate_limit_ticks: 5
    up_rate_limit_ticks: 1
    headroom_factor: 1.40
    headroom_ramp: 0.12
    perf_floor: 0.40
    perf_ceil: 1.0
    perf_init: 0.60
    up_jump_threshold: 0.25
    slow_up_scale: 0.05
    down_fast_threshold: 0.05
    spike_jump_threshold: 0.40
    spike_decay: 0.20
    touch_boost_enabled: true
    touch_boost_ms: 500
    touch_boost_tiers: 1
