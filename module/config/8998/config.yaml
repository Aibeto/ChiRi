meta:
  name: "config_8998"
  author: "ChiRi"
  language: "zh"
  loglevel: "INFO"
  dev_record: true

function:
  CpuIdleScalingGovernor: true
  IOOptimization: true

IO_Settings:
  Scheduler: ""
  read_ahead_kb: "512"
  nomerges: "1"
  iostats: "0"

CpuIdle:
  current_governor: "menu"

scene_mode_delay_secs: 300

Affinity:
  enabled: true
  top_app_uclamp_min_pct: 0
  top_app_uclamp_max_pct: 0
  pin_foreground_threads: true

CoreCtl:
  enabled: true
  # scenemode 离线核：息屏超时进入 scenemode 后小核全开（不足 3 个从大核补足），
  # 大核簇/prime 下线省电。8998 内核 4.4 的热插拔路径质量未知，默认关闭
  # （如需省电可改 true 自行验证）。
  scenemode_offline: false

Thermal:
  enabled: true
  batt_soft_temp_c: 41
  batt_hard_temp_c: 45
  cpu_soft_temp_c: 75
  cpu_hard_temp_c: 85
  soft_perf_cap: 0.70
  hard_perf_cap: 0.40
  free_above: 0.80
  hysteresis_c: 3

powersave:
  cpu_load_governor:
    up_threshold: 0.90
    down_threshold: 0.50
    smoothing_up: 0.50
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    headroom_ramp: 0.12
    perf_floor: 0.05
    perf_ceil: 0.60
    perf_init: 0.25
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    down_fast_threshold: 0.10
    spike_jump_threshold: 0.35
    spike_decay: 0.30
    touch_boost_enabled: true
    touch_boost_ms: 350
    touch_boost_tiers: 1

balance:
  cpu_load_governor:
    up_threshold: 0.72
    down_threshold: 0.55
    smoothing_up: 0.75
    down_rate_limit_ticks: 1
    up_rate_limit_ticks: 1
    headroom_factor: 1.20
    headroom_ramp: 0.12
    perf_floor: 0.10
    perf_ceil: 1.0
    perf_init: 0.40
    up_jump_threshold: 0.30
    slow_up_scale: 0.03
    down_fast_threshold: 0.20
    spike_jump_threshold: 0.40
    spike_decay: 0.25
    touch_boost_enabled: true
    touch_boost_ms: 400
    touch_boost_tiers: 1

performance:
  cpu_load_governor:
    up_threshold: 0.55
    down_threshold: 0.40
    smoothing_up: 0.95
    down_rate_limit_ticks: 5
    up_rate_limit_ticks: 1
    headroom_factor: 1.40
    headroom_ramp: 0.12
    perf_floor: 0.40
    perf_ceil: 1.0
    perf_init: 0.60
    up_jump_threshold: 0.25
    slow_up_scale: 0.05
    down_fast_threshold: 0.05
    spike_jump_threshold: 0.40
    spike_decay: 0.20
    touch_boost_enabled: true
    touch_boost_ms: 500
    touch_boost_tiers: 1
