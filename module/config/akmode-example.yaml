# akmode-example.yaml —— 明日方舟特调的参考配置
#
# 用法：把这份文件复制成同目录的 akmode.yaml 再改。守护进程只认 akmode.yaml，
# 本文件不参与加载，纯粹当说明书用。
#
# 生效条件：命中 CHIRI_SOC_HINTS（8550）且前台是明日方舟。生效期间主调度（CLG）
# 让位，改由 akmode 接管；退出前台就交还 CLG。
#
# 档位 = 全局那套模式（powersave/balance/performance/fast），由 rules.yaml 的生效模式
# 决定（明日方舟 app_modes > global_mode），特调期间固定应用、不自动切换档位；
# 用户改 rules.yaml 模式后热重载更新档位。
#
# 调频机制：激活时统一内核调速器为 schedutil、min 压到硬件最低；把各核心组
# scaling_max_freq 写到本档 max_freq 上限。schedutil 在 [硬件最低, 档位max] 内按负载
# 动态调频（能升能降、受档位约束）。max_freq 写 0 = 该组不写 max（保持现状）。

akmode:
  # 下面只写 balance 一档做示例，其余三档结构完全一样，复制改参数即可。
  # 每档按核心组（little/big/prime）配置 max 上限。
  # 核心组按 CPU ID 硬编码（8550：0-2 小核 little、3-6 大核 big、7 超大核 prime）。
  #   powersave     = 档 1，最低档
  #   balance       = 档 2，默认起步档
  #   performance   = 档 3
  #   fast          = 档 4，最高档

  modename:
    little:
      # 本档下小核组的频率上限（kHz）：应用本档时写 scaling_max_freq，
      # schedutil 在 [硬件最低, 此值] 内按负载调频。不在频率表里自动吸附到最近档位。
      max_freq: 806400

    big:
      max_freq: 1305600

    prime:
      max_freq: 1497600
