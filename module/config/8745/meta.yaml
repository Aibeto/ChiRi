# meta.yaml: [meta] 用户可修改的抬头字段（守护进程逐字段严格校验）
# 九个字段必须齐全；loglevel 限 OFF/ERROR/WARN/INFO/DEBUG/TRACE，language 限 en/zh。
# 任一字段非法时，daemon 启动/热重载会用二进制内嵌默认整体覆盖本文件并在末尾追加警告注释。
# 修改保存后热重载即时生效。
name: "default_config"
author: "yuki"
language: "zh"
loglevel: "INFO"
dev_record: false
# 功能总开关（缺省 true，热重载即时生效）：
#   fas_enabled: FAS 帧感知调度总闸（关闭后运行中实例立即注销，模式判定不再产生 fas）
#   scenemode_enabled: 息屏场景模式总闸（关闭后息屏不进入 scenemode，运行中立即退出恢复 doze）
#   thread_bind: 线程摆放总闸（关闭后 CPU 亲和/绑核与 core_ctl 核心在线接管全部交还系统，
#                所有绑定分配改成全核心）
fas_enabled: true
scenemode_enabled: true
thread_bind: true
# 功耗口径（PowerAVG.chr，仅 ChiRi）：false = 参考值（旧值先乘 10，与新值 10:1 加权递推，偏历史，含息屏样本）；
#                                   true  = 累计平均值（等权全史，仅亮屏放电样本）。两者都只在放电时取样，热重载即时生效。
power_avg: true
# 常驻状态通知（Android 通知栏，仅 ChiRi）：false = 不投递，并撤销已投递的通知。
notify: true
# 电池读数（仅 ChiRi）：优先 OPlus 私有节点（bcc_parms，随采样刷新）。
# 该节点存在且读到有效值时不回退（同机型标准节点单位与刷新都不可靠）；
# 存在但无效（字段缺失/解析失败/全零）或节点不存在时才用标准节点
oplus_chg: false
# OPlus 双电芯：电压取两节平均、电流 ×2（两节并联分流），仅上面开关打开时有效
oplus_dual_cell: false
# 倍电压 / 倍电流：仅标准节点路径；OPlus 开关打开时这两项被强制关闭
voltage_double: false
current_double: false
# 单位校准（须 > 0，无内置换算）：节点原始值 ÷ 该值 = V / A（功率 = 电流 × 电压）。
# 节点报 mV/mA 时两个都填 1000；报 µV/µA 时都填 1000000
voltage_divisor: 1000
current_divisor: 1000
# 耗电读数满量程（W，WebUI 状态页仪表盘用；可选，默认 12）：只影响显示，不参与调度。
power_max_w: 12
# PowerBase 总开关（Stardust 家族，**高级设置，默认关闭**）：开启后原本由 CLG 接管的
# 场合（reduce / default / boost）改由 PowerBase 以放电功耗为指标调频；FAS / 特调 /
# DOWN 停摆 / 实验室的启停判据不受影响。
powerbase_enabled: false
