# ============================================================
# SM8550（骁龙 8 Gen 2）处理器专属特调模式配置
# - 与同目录 config.yaml 一样，只对命中 CHIRI_SOC_HINTS（"8550"）的处理器生效。
#   特调和处理器绑定，不会下发到默认 config.yaml。
# - 只有白名单应用（common.rs SPECIAL_TUNED_MODES）能启用这些模式；
#   非白名单包名被映射到特调模式时，守护进程会把门控掉，回退全局模式。
# - 本文件在启动时和主配置合并加载，随模块发布，WebUI 不提供编辑入口。
#   改参数：改完触发热重载即可，改 yaml 文件本身不会自动重载。
# - 模式名已在 chiri 的 Config::get_mode 里注册。
# ============================================================

# 325mode 均衡特调，明日方舟的优先回退/默认模式。
# 思路是流畅优先、兼顾省电。这游戏是 2D 塔防，开波和怪海是短时突发高负载，
# 部署、基建、主界面大部分时间负载都很低。想让开波 2~3 个 tick 内升频到位不卡顿，
# 界面和波间尽快降频，挂机省电控温。
325mode:
  cpu_load_governor:
    # 升频阈值：util >= 0.45 走全速升频。
    # 8 Gen 2 跑明日方舟日常 util 大概在 0.3~0.5，阈值太低平时也会满速升，放着耗电。
    up_threshold: 0.45
    # 降频阈值：util < 0.35 按正常速率降频，0.35~0.45 的滞回带内慢降防抖。
    # 记得要比 up_threshold 小，不然会被 normalize 压平，滞回带直接消失。
    down_threshold: 0.35
    # 升频平滑：每 tick 逼近目标 75%，开波大概 2~3 个 tick 到位。
    smoothing_up: 0.75
    # 降频平滑：每 tick 逼近目标 45%。波间/切界面降得缓一点，避免波次衔接时来回掉频。
    smoothing_down: 0.45
    # 降频速率限制：连续 3 个 tick（约 600ms）确认低负载才降一次频，抗短间隙。
    down_rate_limit_ticks: 3
    # 升频速率限制：1 个 tick 就放行，升频不卡。
    up_rate_limit_ticks: 1
    # 性能余量：高负载时目标性能 = util * 1.20。8 Gen 2 对这个游戏性能过剩，收一点省电。
    headroom_factor: 1.20
    # 余量过渡带：util 从 up_threshold-0.20 到 up_threshold 线性由 1.0 渐变到 headroom_factor。
    headroom_ramp: 0.20
    # 性能下限：目标性能不低于 20%，界面滑动/基建操作不掉速。
    perf_floor: 0.20
    # 性能上限：怪海峰值最多给到 85%，留 15% 控温，不拉满。
    perf_ceil: 0.85
    # 接管瞬间初始性能：冷启动直接锁 65% 档位，够流畅进主界面，再按负载自动回落。
    perf_init: 0.65
    # 升频快速通道：target 比当前高 0.25 以上就直接按满 smoothing_up 升频（开波跳变入口）。
    up_jump_threshold: 0.25
    # 滞回带内升频缩放：低负载段只用 6% 的升频速率防抖，util 越接近 up_threshold 越快恢复全速。
    slow_up_scale: 0.06
    # 滞回带内降频缩放：慢速下探防抖。
    slow_down_scale: 0.50
    # 极低负载阈值：util < 0.15（基建/主界面）触发快速降频。
    down_fast_threshold: 0.15
    # 快速降频倍数：界面期降频快 3 倍，尽早把频率释放掉。
    down_fast_mult: 3.0
    # 尖峰判定：单 tick util 跳升超过 0.40 当可疑尖峰处理。
    spike_jump_threshold: 0.40
    # 尖峰衰减：尖峰增量只保留 45%。持续负载下一 tick 就全量生效（最多延迟约 200ms）。
    spike_decay: 0.45

# 799mode 高压模式，明日方舟可选特调（白名单应用手动切换）。
# 走极致流畅：阈值更低、升频更快、降频更保守、下限抬高。
# 适合高难关卡、怪海、低容错操作；代价是发热和续航。
799mode:
  cpu_load_governor:
    # 升频阈值：util >= 0.35 就全速升频，开波响应最快。
    up_threshold: 0.35
    # 降频阈值：util < 0.30 才按正常速率降频，滞回带很窄。
    down_threshold: 0.30
    # 升频平滑：每 tick 逼近目标 90%，1~2 个 tick 到位。
    smoothing_up: 0.90
    # 降频平滑：每 tick 逼近目标 35%，波间保持较高频率，不掉帧。
    smoothing_down: 0.35
    # 降频速率限制：连续 4 个 tick（约 800ms）低负载才降频，尽力稳持频率。
    down_rate_limit_ticks: 4
    # 升频速率限制：1 个 tick 就放行。
    up_rate_limit_ticks: 1
    # 性能余量：目标性能 = util * 1.35，给高难波次留足余量。
    headroom_factor: 1.35
    # 余量过渡带：收窄到 0.15，更快进入全余量状态。
    headroom_ramp: 0.15
    # 性能下限：不低于 40%，主界面/基建也更跟手。
    perf_floor: 0.40
    # 性能上限：不设限，怪海允许拉满。
    perf_ceil: 1.0
    # 接管瞬间初始性能：冷启动锁 90% 档位，进战斗就高帧。
    perf_init: 0.90
    # 升频快速通道：target 比当前高 0.20 就按满速升频，跳变响应更早。
    up_jump_threshold: 0.20
    # 滞回带内升频缩放：低负载起 10% 速率，略高于均衡模式。
    slow_up_scale: 0.10
    # 滞回带内降频缩放：下探更慢（0.40），减少抖频。
    slow_down_scale: 0.40
    # 极低负载阈值：util < 0.10 才快速降频（界面期仍保留一点余温）。
    down_fast_threshold: 0.10
    # 快速降频倍数：x2.5，比均衡模式略缓，界面切换仍保持一定余温。
    down_fast_mult: 2.5
    # 尖峰判定：单 tick 跳升超过 0.50 才当可疑尖峰（判定更松，保留真实负载）。
    spike_jump_threshold: 0.50
    # 尖峰衰减：尖峰增量保留 60%，波形跟着真实负载走。
    spike_decay: 0.60