# ============================================================
# SM8550（骁龙 8 Gen 2）处理器独立配置
# 命中 CHIRI_SOC_HINTS（"8550"）时优先加载本目录下的 config.yaml，缺省字段回退代码默认值，不影响其它机型。
# 本目录 akmode.yaml 为该处理器的特调参数（8550 与 8475/8998 参数相同，各自维护一份）。
# 调整参数后可热重载（config_watcher 监听 config 目录）。
# ============================================================

# 元数据信息
meta:
  name: "config_8550"
  author: "ChiRi"
  language: "zh"
  loglevel: "INFO"

# 主要功能开关
function:
  CpuIdleScalingGovernor: false
  IOOptimization: true

# IO 设置
IO_Settings:
  Scheduler: ""
  read_ahead_kb: "512"
  nomerges: "1"
  iostats: "0"

# CPU 空闲设置
CpuIdle:
  current_governor: ""

# 息屏进入 scenemode 的延迟（秒）：屏幕熄灭超过该时长后切换到 scenemode 省电配置，
# 亮屏即恢复原模式。默认 300（5 分钟）。
scene_mode_delay_secs: 300

# --- 性能模式 ---

# 省电模式
powersave:
  cpu_load_governor:
    up_threshold: 0.90
    down_threshold: 0.50
    smoothing_up: 0.50
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    headroom_ramp: 0.12
    perf_floor: 0.05
    perf_ceil: 0.60
    perf_init: 0.25
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    down_fast_threshold: 0.10
    spike_jump_threshold: 0.35
    spike_decay: 0.30
    touch_boost_enabled: true
    touch_boost_ms: 350
    touch_boost_tiers: 1

# 均衡模式
balance:
  cpu_load_governor:
    up_threshold: 0.72
    down_threshold: 0.55
    smoothing_up: 0.75
    down_rate_limit_ticks: 1
    up_rate_limit_ticks: 1
    headroom_factor: 1.20
    headroom_ramp: 0.12
    perf_floor: 0.10
    perf_ceil: 1.0
    perf_init: 0.40
    up_jump_threshold: 0.30
    slow_up_scale: 0.03
    down_fast_threshold: 0.20
    spike_jump_threshold: 0.40
    spike_decay: 0.25
    touch_boost_enabled: true
    touch_boost_ms: 400
    touch_boost_tiers: 1

# 性能模式
performance:
  cpu_load_governor:
    up_threshold: 0.55
    down_threshold: 0.40
    smoothing_up: 0.95
    down_rate_limit_ticks: 5
    up_rate_limit_ticks: 1
    headroom_factor: 1.40
    headroom_ramp: 0.12
    perf_floor: 0.40
    perf_ceil: 1.0
    perf_init: 0.60
    up_jump_threshold: 0.25
    slow_up_scale: 0.05
    down_fast_threshold: 0.05
    spike_jump_threshold: 0.40
    spike_decay: 0.20
    touch_boost_enabled: true
    touch_boost_ms: 500
    touch_boost_tiers: 1

# 极速模式（fast）无需配置：由守护进程硬编码把 min=max 锁到硬件最高频，见 src/chiri/cpu_load_governor.rs
