# max_freq：本档位下该核心组的频率上限（kHz），切到本档时写入 scaling_max_freq。
# schedutil 在 [硬件最低, 档位max] 内按负载动态调频；写 0 = 该组不写 max（保持现状）。
akmode:
  after_change_duration_ms: 799

  powersave:
    wait_ms: 325
    little:
      up_core_count: 2
      up_util_percent: 90
      down_core_count: 2
      down_util_percent: 60
      max_freq: 403200
    big:
      up_core_count: 3
      up_util_percent: 90
      down_core_count: 2
      down_util_percent: 60
      max_freq: 806400
    prime:
      up_core_count: 1
      up_util_percent: 90
      down_core_count: 1
      down_util_percent: 60
      max_freq: 940800

