# 明日方舟特调（akmode）：按 rules.yaml 生效模式固定应用对应档位的限频策略，
# 运行中不自动切换档位（改 rules.yaml 模式后热重载更新档位）。
# max_freq：本档位下该核心组的频率上限（kHz），应用本档时写入 scaling_max_freq，
# schedutil 在 [硬件最低, 档位max] 内按负载动态调频；写 0 = 该组不写 max（保持现状）。
akmode:
  powersave:
    little:
      max_freq: 403200
    big:
      max_freq: 806400
    prime:
      max_freq: 940800

  balance:
    little:
      max_freq: 806400
    big:
      max_freq: 1305600
    prime:
      max_freq: 1497600

  performance:
    little:
      max_freq: 1267200
    big:
      max_freq: 2073600
    prime:
      max_freq: 2323200

  fast:
    little:
      max_freq: 1804800
    big:
      max_freq: 2803200
    prime:
      max_freq: 3190000
