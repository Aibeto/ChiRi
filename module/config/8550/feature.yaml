# 8550/feature.yaml: [function] [io-settings] [cpu-idle] [affinity] [corectl] [thermal] [reduce] [default] [boost]

# [function]
function:
  CpuIdleScalingGovernor: true
  IOOptimization: true

# [io-settings]
# IO 设置
IO_Settings:
  Scheduler: ""
  read_ahead_kb: "512"
  nomerges: "1"
  iostats: "0"

# [cpu-idle]
CpuIdle:
  current_governor: "menu"

scene_mode_delay_secs: 300

# [affinity]
Affinity:
  enabled: true
  top_app_uclamp_min_pct: 0
  top_app_uclamp_max_pct: 85
  pin_foreground_threads: true
  # 后台降权（background / restricted 的 cpu.uclamp.max 百分比，0 = 关闭）：
  # 后台任务的 util 需求被钳低 → EAS 放置与 schedutil 频率回落、优先落小核，
  # 给 UI/视频等视觉可感的线程让路；不禁止使用大核（空闲时仍会被调度上去）。
  # 刻意不含 system-background（媒体/音频等可感知的系统后台）。
  background_uclamp_max_pct: 50

# [corectl]
CoreCtl:
  enabled: true
  # scenemode 离线核：息屏超时进入 scenemode 后小核全开（保证 ≥3 个待命核响应
  # 电源键等事件，另留 1 个专用小核给调度服务），大核簇/prime 整簇断电消除
  # 空转漏电流；little 持续顶满上限则退回 reduce 并冷却 300s。亮屏按快照恢复。
  scenemode_offline: true

# [thermal]
Thermal:
  enabled: true
  batt_soft_temp_c: 41
  batt_hard_temp_c: 45
  # CPU 温度仅极端热时参与（内核 ~95°C 温控兜底）：soc_max 合成温区在大型游戏
  # 高负载下常态 85°C+，75/85 会导致过半时间被软件压制、比官调更卡；90/95
  # 只在接近内核起控点时提前轻压
  cpu_soft_temp_c: 90
  cpu_hard_temp_c: 95
  # 2026-09-22 实测调整（仅本机型）：原 0.70 是一刀切，电池 40.7℃ 触发后瞬间砍掉
  # 三成上限 = 断崖式掉帧。改 0.85 让压制更平缓（少掉帧、也不至于失控），
  # 真正的解法是 P1/P3 把功耗压下去让温度不上来——这条只是把「断崖」改成「斜坡」。
  # 安全阈值本身（batt_soft_temp_c / batt_hard_temp_c）不动。
  soft_perf_cap: 0.85
  hard_perf_cap: 0.40
  free_above: 0.80
  hysteresis_c: 3

# [sched]
# 内核调度器参数微调（借鉴 LittleYouran CTS 的 Scheduler 段）：migration_cost 由
# 内核默认 500000 降到 200000——调度器更愿意跨核均衡、避免单核积压（855 八核
# 同构经验值）；nr_migrate 32→27 收敛单次均衡迁移量。写 /proc/sys/kernel/，白名单外忽略
Sched:
  enabled: true
  params:
    sched_migration_cost_ns: "200000"
    sched_nr_migrate: "27"

# [reduce]
reduce:
  cpu_load_governor:
    up_threshold: 0.90
    down_threshold: 0.50
    smoothing_up: 0.50
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    headroom_ramp: 0.12
    perf_floor: 0.05
    perf_ceil: 0.60
    perf_init: 0.20
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    down_fast_threshold: 0.10
    spike_jump_threshold: 0.35
    spike_decay: 0.30
    touch_boost_enabled: true
    touch_boost_ms: 350
    touch_boost_tiers: 1

# [default]
default:
  cpu_load_governor:
    up_threshold: 0.78
    down_threshold: 0.55
    smoothing_up: 0.75
    # 防抖：原 1/1 等于无防抖，8550 实测 cap 与方向每 tick 都可能翻转
    # （升频平滑推进、降频一步到位，util 抖动即来回改写 scaling_max_freq）。
    # 调回 2/3；低载（<down_fast_threshold）仍跳过降频防抖立即下调，空闲不受影响
    down_rate_limit_ticks: 3
    up_rate_limit_ticks: 2
    headroom_factor: 1.05
    headroom_ramp: 0.12
    perf_floor: 0.05
    # 2026-09-22 实测调整：本文件是 SoC 覆盖，会盖掉根 feature.yaml，故这里同步改。
    # 日常档加天花板 0.80（原 1.0）；交互响应靠下方 touch_boost_ms 兜，别只降 ceil。
    perf_ceil: 0.80
    perf_init: 0.25
    # 按核心组再收紧（8550 实测日常 util：little 0.55 / big 0.36 / prime 0.32，
    # 但三簇上限都被尖峰顶到 100%）——三簇一刀切只能取「最松那簇」能接受的值：
    # little 最热压到 0.70，prime 空转多压到 0.65，big 不覆盖、继承 0.80。
    # [A/B 结论 2026-09-22] 迁移率异常与 per_cluster 无关：0922-1306 包（更旧的
    # 40 列版本、无任何天花板）亮屏 UI 场景迁移同样 ~2500-5000/s——高迁移是
    # surfaceflinger/system_server 主导的亮屏 UI 固有形态，视频稳态才是 ~300/s。
    # 之前拿 cloudmusic（亮屏 UI）对比 0920 视频稳态属场景错配，P2 嫌疑解除，
    # 恢复按簇收紧。
    per_cluster:
      little:
        perf_ceil: 0.70
      prime:
        perf_ceil: 0.65
    up_jump_threshold: 0.30
    slow_up_scale: 0.03
    down_fast_threshold: 0.25
    spike_jump_threshold: 0.40
    spike_decay: 0.25
    touch_boost_enabled: true
    touch_boost_ms: 400
    touch_boost_tiers: 1

# [boost]
boost:
  cpu_load_governor:
    up_threshold: 0.55
    down_threshold: 0.40
    smoothing_up: 0.95
    down_rate_limit_ticks: 5
    up_rate_limit_ticks: 1
    headroom_factor: 1.25
    headroom_ramp: 0.12
    perf_floor: 0.40
    perf_ceil: 1.0
    perf_init: 0.60
    up_jump_threshold: 0.25
    slow_up_scale: 0.05
    down_fast_threshold: 0.05
    spike_jump_threshold: 0.40
    spike_decay: 0.20
    touch_boost_enabled: true
    touch_boost_ms: 500
    touch_boost_tiers: 1

# [powerbase]
# PowerBase（Stardust 家族，开关在 meta.yaml `powerbase_enabled`，默认关闭）：
# 8550 实测日常/视频放电功耗在 2~3W 区间，目标取 2.5W——低于它放宽升频，达到即守住。
# 字段含义见根 config/feature.yaml 的同名段。
powerbase:
  target_power_w: 2.0
