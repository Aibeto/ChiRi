# 
# ChiRi 线程亲和黑名单
# ------------------------------------------------------------
# 本文件经 include_str! 编译进守护进程二进制（不外透、WebUI 不可见、
# 修改磁盘副本无效），独立成文件便于维护——调整后需重新编译。
#
# 命中黑名单的进程：全部线程保持全核运行（0..max 核），
# AffinityManager 不对其做任何迁移与亲和放置。
#
# 语法（与特调白名单 special_tuned.yaml 同风格）：
#   - 每行一条匹配器，# 开头为注释，空行忽略；
#   - 精确匹配：进程名/包名整串相等（应用子进程如 com.example.game:push
#     需单独写一条，或用正则覆盖）；
#   - 正则匹配：re: 前缀，忽略大小写在表达式内使用 (?i)。
#
# 匹配对象：/proc/<pid>/cmdline 全串。应用进程的 cmdline 通常就是包名；
# init 拉起的 native 服务的 cmdline 是二进制路径（以 / 开头，内置规则已兜底跳过）。
# 

# —— 系统进程默认黑名单（勿删：对系统关键进程做线程迁移会导致系统级卡死/重启）——
system_server
surfaceflinger
logd
lmkd
installd
vold
servicemanager
hwservicemanager
vndservicemanager
cameraserver
audioserver
mediaserver
media.extractor
media.codec
media.swcodec
gpsd
netd
netmgrd
zygote
zygote64
usap
webview_zygote
platform_compat
statsd
traced_probes
traced_producer
traced
perfetto
tombstoned
incidentd
demesg
apexd
bootanim
hwcomposer

# —— UI 视觉进程（2026-09-18 加：始终占用所有核心，UI 零卡顿保障）——
# SystemUI 与桌面：全部线程保持全核、不做任何迁移/钉核（用户要求；桌面墙纸/
# 系统下拉/最近任务等动画线程不受任何收窄影响）。
# 桌面包名按默认（AOSP launcher/launcher3）+ 小米（miui.home，包名特殊不按机型判断直接加）
com.android.systemui
com.android.launcher
com.android.launcher3
com.miui.home

# —— 输入法（2026-09-22 加：语音输入启动延迟豁免）——
# 输入法是常驻可感知进程：语音面板打开时需要立刻冷启动录音/识别管线，被钉核/
# 迁移/后台降权拖慢会直接表现为「按住说话后麦克风要等一会才启动」。
# 全部保持全核、不做任何迁移与钉核。
# 边界：cgroup 组级的 cpu.uclamp.max 钳制（background 组 50%）不受本名单影响
# （组内无法按包豁免）；多数 ROM 的 IME 在 foreground 组，不吃该钳制。
com.iflytek.inputmethod
com.iflytek.inputmethod.miui
com.sohu.inputmethod.sogou
com.sohu.inputmethod.sogou.xiaomi
com.baidu.input
com.baidu.input_mi
com.google.android.inputmethod.latin
com.tencent.wetype
# 正则兜底：主流输入法包名几乎都含 inputmethod，覆盖未知变体
re:(?i)inputmethod

