# ChiRi 内部特调白名单 —— 经 include_str! 编译进守护进程二进制。
# 运行时磁盘上任何同名文件都只是导出快照，改动不生效（防篡改）。
#
# 格式：每行一条 `匹配器:模式列表(逗号分隔):优先回退模式`
#   匹配器     = 精确包名；或 "re:" 前缀 + 正则表达式（匹配器内不要包含 ':'，
#                正则自身忽略大小写请写 (?i) 前缀）
#   模式列表   = 该应用可用的特调模式，须已在 chiri Config::get_mode 注册
#   优先回退   = 用户未显式配置该应用时采用的模式，必须在模式列表内
#
# 匹配顺序：精确包名优先（按文件内顺序），未命中再按正则条目（按文件内顺序）。
# WebUI 导出的 special_tuned.yaml 只包含精确条目（正则条目无法按包名精确查找）。
#
# 特调参数组（normal/tuned_profiles.yaml 的 tuned_profiles 段，键名 = 模式名，同名即自动生效）：
#   akmode   = 游戏（缺省段，headroom 1.15 保响应，走 boost 亲和）
#   playback = 视频播放稳态（headroom 1.05 贴负载 + 平滑 0.35，不走 boost 亲和）
# 只给长稳态场景做特调；高频短交互（桌面/聊天/工具）不做（daily 组已于 2026-09-17 晚移除）
#
# 明日方舟国服
com.hypergryph.arknights:akmode:akmode
# 明日方舟（Yostar）
com.YoStarJP.Arknights:akmode:akmode
# 兜底：任何包名含 arknights（忽略大小写）的应用，覆盖台服/Mod 变体等
re:(?i)arknights:akmode:akmode

# playback 组（视频播放；2026-09-17 8550 日志分析新增：亮屏最大功耗头，
# 101min/1.27W 占 61% 时间；连续控制贴负载收紧大核组上限）
# B 站主包
tv.danmaku.bili:playback:playback
# 兜底：bilibili 家族（HD/国际版/概念版等，忽略大小写）
re:(?i)(bilibili|danmaku\.bili):playback:playback

# daily 组已移除（2026-09-17 晚，按上机实测反馈）：不是所有程序都需要特调——
# 桌面/聊天/资讯/工具属高频短交互，特调接管收益低、侵入高（实测这批应用在
# daily 下的功耗与 CLG 基线相当，但它们对跟手性更敏感）。特调只保留长稳态
# 场景（playback 视频、akmode 游戏）。如需重新启用：加回条目 + 在
# tuned_profiles.yaml 配同名参数组。
#
# 已移除的条目（留档，勿直接复制回）：com.android.launcher / com.tencent.mobileqq /
# com.aliyun.tongyi / com.ss.android.lark / com.coolapk.market / com.microsoft.emmx.beta /
# bin.mt.plus.canary / com.trim.app / com.netease.cloudmusic / com.deepseek.chat /
# com.android.documentsui / com.littlewhale.combinedstatus / yangfentuozi.batteryrecorder /
# com.moondroplab.moondrop.moondrop_app / fans.lty.app / org.lsposed.manager /
# me.weishu.kernelsu / re:(?i)launcher
