# ChiRi 内部特调白名单 —— 经 include_str! 编译进守护进程二进制。
# 运行时磁盘上任何同名文件都只是导出快照，改动不生效（防篡改）。
#
# 格式：每行一条 `匹配器:模式列表(逗号分隔):优先回退模式`
#   匹配器     = 精确包名；或 "re:" 前缀 + 正则表达式（匹配器内不要包含 ':'，
#                正则自身忽略大小写请写 (?i) 前缀）
#   模式列表   = 该应用可用的特调模式，须已在 chiri Config::get_mode 注册
#   优先回退   = 用户未显式配置该应用时采用的模式，必须在模式列表内
#
# 匹配顺序：精确包名优先（按文件内顺序），未命中再按正则条目（按文件内顺序）。
# WebUI 导出的 special_tuned.yaml 只包含精确条目（正则条目无法按包名精确查找）。
#
# 特调参数组（normal/tuned_profiles.yaml 的 tuned_profiles 段，键名 = 模式名，同名即自动生效）：
#   akmode   = 游戏（缺省段，headroom 1.15 保响应，走 boost 亲和）
#   playback = 视频播放稳态（headroom 1.0 贴负载 + 平滑 0.35，不走 boost 亲和）
#   daily    = 日常轻载交互（headroom 1.0 + floor 0.10 保底 + 平滑 0.5，不走 boost 亲和）
#
# 明日方舟国服
com.hypergryph.arknights:akmode:akmode
# 明日方舟（Yostar）
com.YoStarJP.Arknights:akmode:akmode
# 兜底：任何包名含 arknights（忽略大小写）的应用，覆盖台服/Mod 变体等
re:(?i)arknights:akmode:akmode

# playback 组（视频播放；2026-09-17 8550 日志分析新增：亮屏最大功耗头，
# 101min/1.27W 占 61% 时间；连续控制贴负载收紧大核组上限）
# B 站主包
tv.danmaku.bili:playback:playback
# 兜底：bilibili 家族（HD/国际版/概念版等，忽略大小写）
re:(?i)(bilibili|danmaku\.bili):playback:playback

# daily 组（日常轻载交互；2026-09-17 8550 日志分析新增：这些场景组占用普遍
# 偏低而频率偏高，收紧到贴负载 + 快速回落静态功耗）
# 桌面
com.android.launcher:daily:daily
# 社交/资讯/工具（按实测出现频率排序）
com.tencent.mobileqq:daily:daily
com.aliyun.tongyi:daily:daily
com.ss.android.lark:daily:daily
com.coolapk.market:daily:daily
com.microsoft.emmx.beta:daily:daily
bin.mt.plus.canary:daily:daily
com.trim.app:daily:daily
com.netease.cloudmusic:daily:daily
com.deepseek.chat:daily:daily
com.android.documentsui:daily:daily
com.littlewhale.combinedstatus:daily:daily
yangfentuozi.batteryrecorder:daily:daily
com.moondroplab.moondrop.moondrop_app:daily:daily
fans.lty.app:daily:daily
org.lsposed.manager:daily:daily
me.weishu.kernelsu:daily:daily
# 兜底：各厂商/第三方 launcher 换皮（忽略大小写）
re:(?i)launcher:daily:daily
