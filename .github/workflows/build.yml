name: Build ChiRi

# 触发条件：当推送到 main 分支，或者发布 tag 时触发。
# workflow_dispatch 允许在 GitHub 网页端手动点击运行。
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Package
    # 使用最新的 Ubuntu 运行环境
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      # 2. 配置 Node.js 环境 (用于编译 WebUI)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # 推荐使用 LTS 版本
          
      # 3. 安装 WebUI 依赖
      - name: Install WebUI dependencies
        working-directory: ./webui
        run: npm install

      # 4. 配置 Rust Nightly 环境并添加 Android 交叉编译目标
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src # build-std 需要用到 (含 bpfel-unknown-none)

      # 5. 安装 bpf-linker（官方预编译二进制，静态链接 LLVM，无系统依赖）。
      #    背景：bpf-linker 0.11 依赖 LLVM 21+，源码编译需要系统 LLVM 21+
      #    （ubuntu runner 无可用包）；cargo-binstall 因 asset 平台匹配问题回退到
      #    cargo install 而失败。因此直接经 GitHub API 解析官方 release asset 下载。
      #    build.rs 检测到 PATH 中已有 bpf-linker 后会跳过其内置安装逻辑。
      - name: Install bpf-linker (prebuilt)
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          ASSET=$(curl -s https://api.github.com/repos/aya-rs/bpf-linker/releases/tags/v0.11.0 | \
            python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['browser_download_url'] for a in d['assets'] if 'x86_64-unknown-linux' in a['name'] and 'debuginfo' not in a['name']))")
          echo "Downloading $ASSET"
          curl -L -o /tmp/bpf-linker.tar.zst "$ASSET"
          mkdir -p /tmp/bpf-linker
          tar --use-compress-program=zstd -xf /tmp/bpf-linker.tar.zst -C /tmp/bpf-linker
          sudo find /tmp/bpf-linker -type f -name bpf-linker -exec install -m 755 {} /usr/local/bin/bpf-linker \;
          bpf-linker --version

      # 6. 安装 Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      # 7. 配置 NDK 环境变量并安装 cargo-ndk
      - name: Setup cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          cargo install cargo-ndk

      # 8. 运行 xtask 构建（仅组装目录，不预打包 zip；GitHub 下载产物时会自动压缩）
      - name: Run xtask build
        run: cargo xtask build --no-pack

      # 9. 动态获取 xtask 生成的模块目录（按 module.prop 命名）
      - name: Resolve Artifact Directory
        id: artifact
        run: |
          # 找到 output 下生成的模块目录（no-pack 模式下仅一个，.temp 已重命名）
          DIR_PATH=$(ls -d output/*/ | head -n 1 | sed 's/\/$//')
          DIR_NAME=$(basename "$DIR_PATH")

          # 目录名即 artifact 名（GitHub 下载时自动生成同名的 <name>.zip）
          echo "name=$DIR_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$DIR_PATH" >> "$GITHUB_OUTPUT"

      # 10. 上传整个模块目录（不做预打包，交由 GitHub 统一压缩成 <name>.zip）
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          # 使用上一步获取的动态名称
          name: ${{ steps.artifact.outputs.name }}
          # 精确指定要上传的那一个目录
          path: ${{ steps.artifact.outputs.path }}
